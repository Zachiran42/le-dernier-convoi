; Example only: copy selected sections into the game's export_presets.cfg.
; Android uses prebuilt APKs, no Gradle / NDK / CMake download.
[preset.0]
name="Android"
platform="Android"
runnable=false
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
